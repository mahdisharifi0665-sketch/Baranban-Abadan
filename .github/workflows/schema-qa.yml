name: Schema QA

on:
  workflow_dispatch:
  schedule:
    - cron: "30 5 * * *" # Daily operational data and forecast verification
    - cron: "30 7 * * 0" # Weekly full historical backtest
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read
  actions: write

concurrency:
  # Preserve the original group key so new pushes can supersede stale queued
  # runs created under earlier workflow revisions.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'push' }}

jobs:
  validate-forecast-schema:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
          package-manager-cache: false
      - name: Delete obsolete orphaned queued push runs from this workflow
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPOSITORY: ${{ github.repository }}
          GH_RUN_ID: ${{ github.run_id }}
          GH_API_URL: ${{ github.api_url }}
        run: |
          node --input-type=module <<'NODE'
          const { GH_TOKEN, GH_REPOSITORY, GH_RUN_ID, GH_API_URL } = process.env;
          const headers = {
            Accept: "application/vnd.github+json",
            Authorization: `Bearer ${GH_TOKEN}`,
            "X-GitHub-Api-Version": "2022-11-28"
          };
          const endpoint = `${GH_API_URL}/repos/${GH_REPOSITORY}/actions/workflows/schema-qa.yml/runs?status=queued&per_page=100`;
          const listing = await fetch(endpoint, { headers });
          if (!listing.ok) throw new Error(`Could not list queued runs: HTTP ${listing.status} ${await listing.text()}`);
          const payload = await listing.json();
          const obsolete = (payload.workflow_runs || []).filter(run =>
            String(run.id) !== String(GH_RUN_ID) &&
            run.event === "push" &&
            run.head_branch === "main" &&
            Number(run.id) < Number(GH_RUN_ID)
          );
          console.log(`Found ${obsolete.length} obsolete queued push run(s) to delete.`);
          let failures = 0;
          for (const run of obsolete) {
            const response = await fetch(
              `${GH_API_URL}/repos/${GH_REPOSITORY}/actions/runs/${run.id}`,
              { method: "DELETE", headers }
            );
            if (response.status === 204 || response.status === 404) {
              console.log(`Deleted obsolete run ${run.id} (${run.head_sha.slice(0, 10)}); HTTP ${response.status}.`);
            } else {
              failures++;
              console.error(`Could not delete run ${run.id}: HTTP ${response.status} ${await response.text()}`);
            }
          }
          if (failures) throw new Error(`${failures} obsolete queued run(s) could not be deleted.`);
          NODE
      - name: Install pinned validators
        run: npm install --no-save --no-package-lock ajv@8.20.0 ajv-formats@3.0.1 mqtt@5.14.1
      - name: Validate schema and regression cases
        run: npm run test:schema
      - name: Test precipitation aggregation and ensemble probability
        run: npm run test:precipitation
      - name: Test Open-Meteo time and calendar-day adapter
        run: npm run test:time-adapter
      - name: Test forecast archive envelope and payload integrity
        run: npm run test:archive
      - name: Test rain observation schema and time-series quality controls
        run: npm run test:observations
      - name: Test observation station registry and provenance guards
        run: npm run test:station-registry
      - name: Test ERA5 gridded precipitation parser and archive contract
        run: npm run test:era5-gridded
      - name: Probe public ERA5 gridded precipitation archive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        run: npm run probe:era5-gridded
      - name: Test NOAA GSOD daily observation adapter
        run: npm run test:noaa-gsod
      - name: Probe NOAA GSOD Bandar-e-Dayyer archive and write observation archive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        run: npm run probe:noaa-gsod
      - name: Discover nearby GHCNh stations and probe NOAA SSODv2 2026 files
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: node qa/probe-noaa-ssodv2-stations.mjs
      - name: Test OGIMET SYNOP decoder and exact 24-hour aggregation
        run: npm run test:ogimet-synop
      - name: Probe live OGIMET SYNOP observations for Bandar-e-Dayyer
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 3
        run: npm run probe:ogimet-synop
      - name: Discover Kuwait regional SYNOP stations (read-only probe)
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 5
        run: node qa/probe-kuwait-synop-stations.mjs
      - name: Probe IRIMO WIS2 public SYNOP notification feed
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 4
        run: node qa/probe-irimo-wis2.mjs
      - name: Probe Open-Meteo historical single-run archives for recent observed windows
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 6
        run: node qa/probe-open-meteo-single-runs.mjs
      - name: Backtest archived daily 00Z model runs against strict regional 24-hour observations
        if: github.event_name == 'workflow_dispatch' || (github.event_name == 'schedule' && github.event.schedule == '30 7 * * 0')
        timeout-minutes: 8
        run: npm run backtest:single-runs
      - name: Test forecast and observation verification metrics
        run: npm run test:verification
      - name: Probe live Open-Meteo model endpoints for Abdan and write archive
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 12
        run: node qa/probe-open-meteo.mjs
      - name: Score archived forecasts against complete regional 24-hour observations
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        timeout-minutes: 20
        run: npm run verify:observations
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - name: Upload forecast-cycle archive (90-day interim retention)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('artifacts/forecast-archive/*.json') != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baranyar-forecast-archive-${{ github.run_id }}
          path: artifacts/forecast-archive/*.json
          if-no-files-found: warn
          retention-days: 90
      - name: Upload full historical single-run backtest (90-day interim retention)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('artifacts/verification/single-run-backtest.json') != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baranyar-single-run-backtest-${{ github.run_id }}
          path: artifacts/verification/single-run-backtest.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload regional verification report (90-day interim retention)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('artifacts/verification/verification-report.json') != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baranyar-verification-report-${{ github.run_id }}
          path: artifacts/verification/verification-report.json
          if-no-files-found: error
          retention-days: 90
      - name: Upload regional observation archive (90-day interim retention)
        if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && hashFiles('artifacts/observation-archive/*.json') != ''
        timeout-minutes: 10
        uses: actions/upload-artifact@v4
        with:
          name: baranyar-observation-archive-${{ github.run_id }}
          path: artifacts/observation-archive/*.json
          if-no-files-found: error
          retention-days: 90
